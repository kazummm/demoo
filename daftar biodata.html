<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4">Form Pengisian Biodata</h2>
        <form id="biodataForm">
            <div class="mb-3">
                <label class="form-label">NIM</label>
                <input type="text" class="form-control" id="nim" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nama</label>
                <input type="text" class="form-control" id="nama" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Tanggal Lahir</label>
                <input type="date" class="form-control" id="tglLahir" required>
            </div>
            <div class="mb-3">
                <label class="form-label d-block">Jenis Kelamin</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="jk" id="laki" value="Laki-laki" required>
                    <label class="form-check-label" for="laki">Laki-laki</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="jk" id="perempuan" value="Perempuan">
                    <label class="form-check-label" for="perempuan">Perempuan</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Agama</label>
                <select class="form-select" id="agama" required>
                    <option value="">--Pilih Agama--</option>
                    <option value="Islam">Islam----</option>
                    <option value="Kristen">Kristen----</option>
                    <option value="Katolik">Katolik----</option>
                    <option value="Hindu">Hindu-----</option>
                    <option value="Budha">Budha----</option>
                    <option value="Konghucu">Konghucu----</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Alamat</label>
                <textarea class="form-control" id="alamat" rows="2" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <div class="mt-5">
        <h3>Daftar Biodata</h3>
        <table class="table table-bordered table-striped table-hover mt-3">
            <thead class="table-dark">
                <tr>
                    <th>NIM</th>
                    <th>Nama</th>
                    <th>Tanggal Lahir</th>
                    <th>Jenis Kelamin</th>
                    <th>Agama</th>
                    <th>Alamat</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    document.getElementById('biodataForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah reload halaman

        // Mengambil nilai dari input
        const nim = document.getElementById('nim').value;
        const nama = document.getElementById('nama').value;
        const tglLahir = document.getElementById('tglLahir').value;
        const jk = document.querySelector('input[name="jk"]:checked').value;
        const agama = document.getElementById('agama').value;
        const alamat = document.getElementById('alamat').value;

        // Menambahkan baris ke dalam tabel
        const tableBody = document.getElementById('tableBody');
        const row = `<tr>
            <td>${nim}</td>
            <td>${nama}</td>
            <td>${tglLahir}</td>
            <td>${jk}</td>
            <td>${agama}</td>
            <td>${alamat}</td>
        </tr>`;

        tableBody.innerHTML += row;

        // Reset form setelah submit
        document.getElementById('biodataForm').reset();
    });
</script>

</body>
</html>
